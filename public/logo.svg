<svg viewBox="0 0 460 300" xmlns="http://www.w3.org/2000/svg" aria-label="Driven Mind Academy Logo">
  <defs>
    <!-- Metallic Navy Gradient -->
    <linearGradient id="navyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1E38" />
      <stop offset="50%" stop-color="#132E54" />
      <stop offset="100%" stop-color="#081426" />
    </linearGradient>

    <!-- Deep Navy Bevel -->
    <linearGradient id="navyBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A3B69" />
      <stop offset="100%" stop-color="#061224" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E096" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="60%" stop-color="#AA7C11" />
      <stop offset="85%" stop-color="#E6C875" />
      <stop offset="100%" stop-color="#996D13" />
    </linearGradient>

    <!-- Bright Gold Highlight -->
    <linearGradient id="goldHighlight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B27" />
      <stop offset="50%" stop-color="#FFF2B2" />
      <stop offset="100%" stop-color="#B38719" />
    </linearGradient>

    <!-- Glowing Neural Network Node -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF5CC" stop-opacity="1" />
      <stop offset="40%" stop-color="#E0B638" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#B38515" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- 1. GRADUATION CAP & BOOK -->
    <g id="grad-cap-group">
      <!-- Open Book Wings -->
      <path d="M 185 58 C 210 46, 222 52, 230 55 C 238 52, 250 46, 275 58 C 270 65, 240 60, 230 63 C 220 60, 190 65, 185 58 Z" fill="url(#goldGradient)" />
      <path d="M 188 56 C 210 48, 222 53, 230 56 C 238 53, 250 48, 272 56 C 268 61, 240 57, 230 59 C 220 57, 192 61, 188 56 Z" fill="url(#navyGradient)" />

      <!-- Mortarboard Diamond Cap -->
      <polygon points="230,22 302,38 230,52 158,38" fill="url(#navyGradient)" stroke="url(#goldGradient)" stroke-width="2.5" />
      <polygon points="230,25 296,38 230,50 164,38" fill="url(#navyBevel)" />

      <!-- Cap Skull Base / Band -->
      <path d="M 186 44 L 230 53 L 274 44 L 274 49 C 274 54, 250 59, 230 59 C 210 59, 186 54, 186 49 Z" fill="url(#navyGradient)" stroke="url(#goldGradient)" stroke-width="1.5" />

      <!-- Tassel Button -->
      <circle cx="230" cy="37" r="3.5" fill="url(#goldHighlight)" />

      <!-- Tassel String & Pendant -->
      <path d="M 230 37 Q 270 42 298 52" fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round" />
      <polygon points="296,52 301,62 295,62" fill="url(#goldHighlight)" />
    </g>

    <!-- 2. "DM" MONOGRAM -->
    <g id="dm-monogram" transform="translate(100, 0)">
      <!-- LETTER "D" -->
      <path d="M 22 75 L 82 75 C 118 75, 138 92, 138 126 C 138 162, 115 180, 75 180 L 22 180 C 42 165, 38 152, 38 128 L 38 126 Z" fill="url(#navyGradient)" stroke="url(#goldGradient)" stroke-width="3.5" />
      <path d="M 26 78 L 80 78 C 112 78, 132 94, 132 126 C 132 158, 110 176, 72 176 L 26 176 L 40 162 C 42 138, 42 118, 26 78 Z" fill="url(#navyBevel)" />

      <!-- Inner D Cutout & Silhouette Head with Neural Brain -->
      <g id="d-head-silhouette">
        <path d="M 52 92 C 85 92, 116 102, 116 126 C 116 150, 88 162, 52 162 Z" fill="#0A182A" />

        <!-- Head Profile Silhouette facing right -->
        <path d="M 50 162 C 55 152, 58 142, 58 132 C 58 120, 62 112, 70 110 C 78 108, 86 112, 88 116 C 90 120, 86 124, 91 127 C 94 128, 98 128, 97 132 C 95 136, 88 138, 87 142 C 85 148, 89 155, 82 162 Z" fill="url(#navyGradient)" stroke="url(#goldGradient)" stroke-width="1" />

        <!-- Brain / Neural Network Nodes & Synapses -->
        <g stroke="url(#goldGradient)" stroke-width="1.2" opacity="0.95">
          <line x1="62" y1="120" x2="72" y2="114" />
          <line x1="72" y1="114" x2="82" y2="118" />
          <line x1="62" y1="120" x2="68" y2="130" />
          <line x1="68" y1="130" x2="78" y2="128" />
          <line x1="78" y1="128" x2="82" y2="118" />
          <line x1="68" y1="130" x2="74" y2="142" />
          <line x1="78" y1="128" x2="84" y2="138" />
          <line x1="74" y1="142" x2="84" y2="138" />
          <line x1="62" y1="120" x2="58" y2="132" />
          <line x1="58" y1="132" x2="66" y2="138" />
        </g>

        <!-- Golden Glowing Brain Nodes -->
        <circle cx="62" cy="120" r="2.8" fill="url(#goldHighlight)" />
        <circle cx="72" cy="114" r="2.5" fill="url(#goldHighlight)" />
        <circle cx="82" cy="118" r="3.2" fill="url(#goldHighlight)" />
        <circle cx="68" cy="130" r="2.5" fill="url(#goldHighlight)" />
        <circle cx="78" cy="128" r="3.0" fill="url(#goldHighlight)" />
        <circle cx="74" cy="142" r="2.4" fill="url(#goldHighlight)" />
        <circle cx="84" cy="138" r="2.6" fill="url(#goldHighlight)" />
        <circle cx="58" cy="132" r="2.2" fill="url(#goldHighlight)" />
        <circle cx="66" cy="138" r="2.2" fill="url(#goldHighlight)" />
      </g>

      <!-- LETTER "M" -->
      <path d="M 124 88 L 138 88 L 174 142 L 210 75 L 232 75 L 232 180 L 210 180 L 210 114 L 180 168 L 168 168 L 138 122 L 138 180 L 124 180 Z" fill="url(#navyGradient)" stroke="url(#goldGradient)" stroke-width="3.2" />
      <path d="M 128 92 L 136 92 L 174 148 L 208 80 L 228 80 L 228 176 L 214 176 L 214 110 L 178 164 L 170 164 L 136 116 L 136 176 L 128 176 Z" fill="url(#navyBevel)" />

      <!-- Starburst / Shooting Star Flare on Upper-Right Tip of M -->
      <g id="m-starburst" transform="translate(230, 68)">
        <path d="M 0 -16 L 3 -3 L 16 0 L 3 3 L 0 16 L -3 3 L -16 0 L -3 -3 Z" fill="url(#goldHighlight)" />
        <path d="M 0 -10 L 2 -2 L 10 0 L 2 2 L 0 10 L -2 2 L -10 0 L -2 -2 Z" fill="#FFFFFF" />
        <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
      </g>
    </g>

    <!-- 3. TYPOGRAPHY -->
    <g id="logo-text-group">
      <text x="230" y="222" text-anchor="middle" fill="#0B1E38" font-size="25" font-weight="900" font-family="Georgia, 'Times New Roman', serif" letter-spacing="2.5">
        DRIVEN MIND ACADEMY
      </text>

      <!-- TAGLINE -->
      <g id="tagline-group">
        <line x1="30" y1="248" x2="115" y2="248" stroke="url(#goldGradient)" stroke-width="1.5" />
        <circle cx="115" cy="248" r="2" fill="url(#goldHighlight)" />

        <text x="230" y="252" text-anchor="middle" fill="#7A5C10" font-size="10.5" font-weight="800" font-family="system-ui, sans-serif" letter-spacing="1.8">
          DRIVEN TO LEARN, DETERMINED TO SUCCEED
        </text>

        <circle cx="345" cy="248" r="2" fill="url(#goldHighlight)" />
        <line x1="345" y1="248" x2="430" y2="248" stroke="url(#goldGradient)" stroke-width="1.5" />

        <!-- Bottom Center Gold Star Accent -->
        <g transform="translate(230, 272)">
          <polygon points="0,-6 1.8,-1.8 6.3,-1.8 2.7,0.9 4,5.4 0,2.7 -4,5.4 -2.7,0.9 -6.3,-1.8 -1.8,-1.8" fill="url(#goldHighlight)" />
        </g>
      </g>
    </g>
  </g>
</svg>
